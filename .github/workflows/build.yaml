name: Build and Release Audio Tools

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Linux Setup & Build ---
      - name: Install Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libportaudio2 portaudio19-dev

      - name: Configure CMake (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # --- Windows Setup, Caching & Build ---
      - name: Cache vcpkg Windows Binaries
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            C:/vcpkg/buildtrees
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          vcpkg install portaudio[asio]:x64-windows

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake -B build --fresh -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build Project
        run: cmake --build build --config Release

      # --- Package Windows Programs into a .zip ---
      - name: Package Windows Binaries
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/Windows-programs"
          
          # Copy executables from the Release build folder
          Copy-Item "build/Release/DaDooRunRun.exe" "dist/Windows-programs/"
          Copy-Item "build/Release/ProbeAudioDevs.exe" "dist/Windows-programs/"
          
          # Copy portaudio.dll from the global vcpkg installation path
          Copy-Item "C:/vcpkg/installed/x64-windows/bin/portaudio.dll" "dist/Windows-programs/"
          
          # Create the zip archive
          Compress-Archive -Path "dist/Windows-programs/*" -DestinationPath "dist/Windows-programs.zip"

      # --- Package Linux Programs into a .tar.gz ---
      - name: Package Linux Binaries
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p dist/Linux-programs
          
          # Verify and copy executables with fallback/error reporting
          if [ -f "build/DaDooRunRun" ]; then
            cp build/DaDooRunRun dist/Linux-programs/
          else
            echo "Error: DaDooRunRun binary not found in build/"
            exit 1
          fi

          if [ -f "build/ProbeAudioDevs" ]; then
            cp build/ProbeAudioDevs dist/Linux-programs/
          else
            echo "Error: ProbeAudioDevs binary not found in build/"
            exit 1
          fi

          # Create the tar.gz archive
          cd dist && tar -czvf Linux-programs.tar.gz Linux-programs