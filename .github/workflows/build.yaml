name: Build and Release Audio Tools

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a tag starting with 'v' (e.g., v1.0.0)

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libportaudio2 portaudio19-dev

      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install portaudio

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Rename Binaries for Clarity
        if: matrix.os == 'windows-latest'
        run: |
          Move-Item build/Release/DaDooRunRun.exe build/DaDooRunRun-Windows.exe
          Move-Item build/Release/ProbeAudioDevs.exe build/ProbeAudioDevs-Windows.exe

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/Release/DaDooRunRun.exe
            build/Release/ProbeAudioDevs.exe
            build/DaDooRunRun
            build/ProbeAudioDevs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}