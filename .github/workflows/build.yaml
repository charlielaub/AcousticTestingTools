name: Build and Release Audio Tools

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libportaudio2 portaudio19-dev

      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install portaudio

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Prepare Windows Binaries
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Ensure release artifacts match expected names
          if (Test-Path "build/Release/DaDooRunRun.exe") {
              Copy-Item "build/Release/DaDooRunRun.exe" "build/DaDooRunRun.exe"
          }
          if (Test-Path "build/Release/ProbeAudioDevs.exe") {
              Copy-Item "build/Release/ProbeAudioDevs.exe" "build/ProbeAudioDevs.exe"
          }

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/DaDooRunRun.exe
            build/ProbeAudioDevs.exe
            build/Release/DaDooRunRun.exe
            build/Release/ProbeAudioDevs.exe
            build/DaDooRunRun
            build/ProbeAudioDevs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}