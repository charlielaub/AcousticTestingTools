name: Build and Release Audio Tools

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libportaudio2 portaudio19-dev libeigen3-dev

      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        # REMOVED portaudio from vcpkg install so it does not conflict with our custom ASIO build
        run: |
          vcpkg install eigen3:x64-windows-static

      # --- Native, reliable archive extraction ---
      - name: Download Steinberg ASIO SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          # Use curl.exe directly (built into Windows) to handle GitHub redirects flawlessly (-L follows redirects)
          curl.exe -L "https://github.com" -o "asiosdk.zip"
          
          # Verify the file is not empty before attempting extraction
          if ((Get-Item "asiosdk.zip").Length -lt 10KB) {
              Write-Error "Downloaded zip file is too small. The download likely failed or was blocked."
              exit 1
          }
          
          # Extract the valid zip file
          Expand-Archive -Path "asiosdk.zip" -DestinationPath "."
          # Rename the extracted folder to a clean name for CMake
          Rename-Item -Path "asiosdk-2.3.3" -NewName "asiosdk"

      - name: Configure CMake (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        # Added -DASIO_SDK_LOCAL_PATH to link the runner-downloaded SDK securely
        run: cmake -B build --fresh -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DASIO_SDK_LOCAL_PATH="${{ github.workspace }}/asiosdk"

      - name: Build Project
        run: cmake --build build --config Release

      # --- Package Windows Programs into a .zip ---
      - name: Package Windows Binaries
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/Windows-programs"
          Copy-Item "build/Release/DaDooRunRun.exe" "dist/Windows-programs/"
          Copy-Item "build/Release/ProbeAudioDevs.exe" "dist/Windows-programs/"
          Compress-Archive -Path "dist/Windows-programs" -DestinationPath "dist/Windows-programs.zip"

      # --- Package Linux Programs into a .tar.gz ---
      - name: Package Linux Binaries
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p dist/Linux-programs
          cp build/DaDooRunRun dist/Linux-programs/
          cp build/ProbeAudioDevs dist/Linux-programs/
          cd dist && tar -czvf Linux-programs.tar.gz Linux-programs

      # --- Upload Platform-Specific Archives ---
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Windows-programs.zip
            dist/Linux-programs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
